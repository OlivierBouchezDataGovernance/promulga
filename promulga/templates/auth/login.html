{% extends "portal/base.html" %}
{% block title %}Sign in - {{ site.site_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:460px">
  <div class="card">
    <h1>Sign in</h1>
    {% if oidc_enabled %}
      <p><a class="btn btn-outline" href="/auth/oidc/login?next={{ next | urlencode }}">{{ oidc_label }}</a></p>
      <p class="small muted">or with your e-mail and password:</p>
    {% endif %}
    <form method="post" action="/auth/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="email">E-mail</label>
      <input id="email" type="email" name="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn" type="submit">Sign in</button>
        <a class="small" href="/auth/forgot">Forgot your password?</a></div>
    </form>
  </div>
</div></section>
{% endblock %}
