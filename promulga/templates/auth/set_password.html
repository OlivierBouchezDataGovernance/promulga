{% extends "portal/base.html" %}
{% block title %}Choose a password - {{ site.site_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:460px">
  <div class="card">
    <h1>{{ "Welcome" if purpose == "invite" else "New password" }}</h1>
    <p class="muted">Account: <strong>{{ target.email }}</strong></p>
    <form method="post" action="/auth/set-password">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="hidden" name="purpose" value="{{ purpose }}">
      {% if purpose == "invite" %}
      <label for="name">Your name <span class="hint">(shown to the other participants)</span></label>
      <input id="name" type="text" name="name" value="{{ target.name }}" autocomplete="name">
      {% endif %}
      <label for="password">Password <span class="hint">(at least 10 characters)</span></label>
      <input id="password" type="password" name="password" minlength="10" autocomplete="new-password" required>
      <label for="password2">Repeat the password</label>
      <input id="password2" type="password" name="password2" minlength="10" autocomplete="new-password" required>
      <div class="actions"><button class="btn" type="submit">Save my password</button></div>
    </form>
  </div>
</div></section>
{% endblock %}
