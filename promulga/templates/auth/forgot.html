{% extends "portal/base.html" %}
{% block title %}Forgot password - {{ site.site_name }}{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:460px">
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your e-mail address: if it has an account, you will receive a link to choose a new password.</p>
    <form method="post" action="/auth/forgot">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="email">E-mail</label>
      <input id="email" type="email" name="email" required autofocus>
      <div class="actions"><button class="btn" type="submit">Send me a link</button> <a class="small" href="/auth/login">Back to sign in</a></div>
    </form>
  </div>
</div></section>
{% endblock %}
