{% extends "admin/base.html" %}
{% block title %}My account - {{ site.site_name }}{% endblock %}
{% block content %}
<div class="page-head"><div class="container">
  <h1>My account</h1>
  <p class="muted">{{ user.email }} - role: {{ user.role }}</p>
</div></div>
<section class="section"><div class="container" style="max-width:560px">
  <form class="card" method="post" action="/admin/account">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="name">Name</label>
    <input id="name" type="text" name="name" value="{{ user.name }}">
    <fieldset><legend>Change my password</legend>
      {% if user.password_hash %}<label for="current">Current password</label>
      <input id="current" type="password" name="current" autocomplete="current-password">{% endif %}
      <label for="password">New password <span class="hint">(at least 10 characters; leave empty to keep it)</span></label>
      <input id="password" type="password" name="password" autocomplete="new-password">
      <label for="password2">Repeat the new password</label>
      <input id="password2" type="password" name="password2" autocomplete="new-password">
    </fieldset>
    <div class="actions"><button class="btn" type="submit">Save</button></div>
  </form>
</div></section>
{% endblock %}
