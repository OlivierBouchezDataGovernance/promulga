{% extends "layout.html" %}
{% block navbar %}
<nav class="navbar" aria-label="Main">
  <div class="navbar-inner">
    <a class="brand" href="/">
      <img src="{{ '/assets/' ~ site.logo_asset if site.logo_asset else '/static/promulga-mark.svg' }}" alt="">
      <span>{{ site.site_name }}</span>
    </a>
    <div class="nav-links">
      <a href="/">{{ _("Home") }}</a>
      <a href="/hierarchy">{{ _("Hierarchy") }}</a>
      <a href="/search">{{ _("Search") }}</a>
      {% if user and user.role != 'viewer' %}<a href="/admin">{{ _("Workspace") }}</a>{% endif %}
      {% if user %}
        <form method="post" action="/auth/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="linklike" type="submit">{{ _("Sign out") }}</button></form>
      {% else %}
        <a href="/auth/login?next={{ request.url.path | urlencode }}">{{ _("Sign in") }}</a>
      {% endif %}
    </div>
  </div>
</nav>
{% endblock %}
