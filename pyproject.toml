[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promulga"
version = "0.1.0"
description = "Self-hosted life cycle of governance documents: draft, review, approval, versioned publication, public portal."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Olivier Bouchez" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "argon2-cffi>=23.1",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "nh3>=0.2.15",
  "authlib>=1.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
promulga = "promulga.cli:main"

[tool.setuptools.packages.find]
include = ["promulga*"]

[tool.setuptools.package-data]
promulga = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
